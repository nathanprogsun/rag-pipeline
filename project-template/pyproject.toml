# {{PROJECT_NAME}} — built on top of rag-pipeline.
#
# Install:
#   pip install -e ../rag-pipeline
#   pip install -e .

[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "My application built on rag-pipeline"
requires-python = ">=3.13"
dependencies = [
    "rag-pipeline",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PACKAGE_NAME}}"]

[project.scripts]
# my-cli = "my_app.cli:main"