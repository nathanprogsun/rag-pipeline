[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",                # SQLAlchemy async driver
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "jieba>=0.42.1",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2,<1.0",
    "langchain-text-splitters>=0.3",
    "langchain>=0.3,<0.4",
    "markdownify>=1.2,<2.0",          # html2md (html / docx 内嵌 HTML)
    "mammoth>=1.8.0",                 # docx adapter (Phase 5)
    "openpyxl>=3.1.2",                # xlsx adapter (Phase 5)
    "pgvector>=0.3.0",                # pgvector SQLAlchemy extension
    "pydantic-settings>=2.5.0",
    "pydantic>=2.8,<3.0",
    "pypdf>=5.0.0",
    "pytest-asyncio>=0.24",
    "pytest>=8.3,<10.0",                # Phase 6 引入 tqdm 不该升 pytest; 统一上限 10
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",            # pptx adapter (Phase 5)
    "pyyaml>=6.0",
    "redis>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "tqdm>=4.66",                     # chunker 进度条 (Phase 6)
    "typer>=0.12.0",
    "tokenizers>=0.15.0",             # MiniMax-M3 BPE token 计数 (5b)
]

[project.scripts]
rag-ingest = "rag.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[project.optional-dependencies]
dev = [
    "datasets>=3.0.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ragas>=0.3,<0.4",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.0",
    "types-openpyxl>=3.1.2",
    "types-tqdm>=4.66",
    ]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
markers = [
    "asyncio: mark test as async (pytest-asyncio)",
    "live_llm: real third-party LLM API calls (requires .env credentials)",
]
filterwarnings = [
    # SQLAlchemy 2.0 async engine 的 GC 路径触发 Connection._cancel 协程
    # 未 await 警告。模块级 AsyncSessionLocal.engine 在 import 时创建, 进程
    # 退出时 GC 路径无法访问事件循环。已在 conftest.py 显式 dispose, 但
    # 部分 mock 触发的清理路径仍会冒出。功能无影响, 仅过滤噪音。
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "PLC0415", "PGH003"]
ignore = ["E501", "ANN204"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
allow-star-arg-any = false

[tool.ruff.lint.per-file-ignores]
# 测试里偶发 lazy import（fixture 顺序 / 局部 mock）；src 层由 PLC0415 强制顶格 import
"tests/**" = ["PLC0415"]
# 包 barrel 无 __all__ 时 re-export 由 import 完成；F401 误报未使用
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
# 裸 Any 由 ruff ANN401 在源码层拦截；mypy 不对 Pydantic/extras 等 dict[str, Any] 字段误报 explicit-any

# 裸 Any 由 ruff ANN401 在源码层拦截；mypy 不对 Pydantic 生成字段误报 explicit-any
[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "jieba.*", "testcontainers.*", "pypdf.*", "docx.*", "bs4.*", "pptx.*", "openpyxl.*", "mammoth.*", "data"]
ignore_missing_imports = true
