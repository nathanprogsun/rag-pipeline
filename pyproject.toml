[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.2,<1.0",
    "langchain-text-splitters>=0.3",
    "langchain-core>=0.3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",                # SQLAlchemy async driver
    "pgvector>=0.3.0",                # pgvector SQLAlchemy extension
    "redis>=5.1.0",
    "jieba>=0.42.1",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.0",
    "ragas>=0.3,<0.4",
    "datasets>=3.0.0",
    ]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
markers = [
    "asyncio: mark test as async (pytest-asyncio)",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["E501", "ANN204"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# 裸 Any 由 ruff ANN401 在源码层拦截；mypy 不对 Pydantic 生成字段误报 explicit-any
[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "jieba.*", "testcontainers.*"]
ignore_missing_imports = true
