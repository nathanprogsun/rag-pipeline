name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Unit + Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_test
      PYTHONUNBUFFERED: "1"
      # Optional DashScope API keys for live integration tests (5i-ragas-int).
      # Tests auto-skip when secrets are missing (see live_embed_model /
      # real_llm_chat_model fixtures in tests/integration/conftest.py).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_EMBEDDING_API_KEY: ${{ secrets.OPENAI_EMBEDDING_API_KEY }}
      OPENAI_EMBEDDING_BASE_URL: ${{ secrets.OPENAI_EMBEDDING_BASE_URL }}
      OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
      OPENAI_RERANK_API_KEY: ${{ secrets.OPENAI_RERANK_API_KEY }}
      OPENAI_RERANK_BASE_URL: ${{ secrets.OPENAI_RERANK_BASE_URL }}
      OPENAI_RERANK_MODEL: ${{ secrets.OPENAI_RERANK_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev 2>&1 || uv sync --extra dev

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests

      - name: Type check (mypy, gating)
        # Static type analysis. mypy>=1.11.0 is in dev deps (uv sync --extra dev).
        # CI uses GitHub-hosted ubuntu-latest + setup-python 3.13 + uv, no pyenv,
        # so mypy runs cleanly here (unlike local pyenv 3.13 environments).
        # Strict mode per [tool.mypy] in pyproject.toml: warn_return_any,
        # warn_unused_ignores, disallow_untyped_defs, no_implicit_optional.
        # Excludes: pgvector, jieba, testcontainers, pypdf, docx, bs4, pptx,
        # openpyxl, mammoth, data (third-party type stubs unavailable).
        #
        # Status (2026-06): GATING. All 10 previously-tracked issues
        # resolved in this commit (cli.py / ragas_real.py / query_ext.py /
        # audit.py / cite.py). PRs that introduce new mypy errors will fail CI.
        run: |
          uv run mypy src/rag --no-incremental

      - name: Unit tests (no external deps)
        # Skip live_llm tests (require DashScope API key not available in CI)
        run: |
          uv run pytest tests/unit -v --tb=short -m "not live_llm" -q

      - name: Integration tests (real PG, fake LLM)
        # Integration tests use fake LLM (mock) + real PG via pgvector service.
        # Tests marked live_llm (require real DashScope embedding/llm API) are skipped.
        run: |
          uv run pytest tests/integration -v --tb=short -m "not live_llm" -q

      - name: Coverage report (enforces ≥80% gate)
        # Generate coverage from unit + integration runs.
        # Skips live_llm tests (require external API).
        # --cov-fail-under=80 enforces the project-wide 80% coverage gate
        # documented in tests/AGENTS.md / docs/dev.md.
        # Current baseline (2026-06): 92% — well above the 80% floor.
        run: |
          uv run pytest tests/unit tests/integration \
            --cov=rag \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -m "not live_llm" \
            -q

      - name: Upload coverage to Codecov
        # Uploads coverage.xml to Codecov for PR-comment integration.
        # Requires CODECOV_TOKEN secret in repo settings (Settings → Secrets).
        # fail_ci_if_error: false — don't break CI if Codecov is down.
        # Token is optional for public repos (Codecov uses GitHub OAuth).
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: rag-pipeline-coverage

      - name: Summary
        if: always()
        run: |
          echo "### CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ruff" >> $GITHUB_STEP_SUMMARY
          echo "- Unit: tests/unit (no live_llm)" >> $GITHUB_STEP_SUMMARY
          echo "- Integration: tests/integration (real PG, mock LLM)" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: coverage.xml (upload to Codecov optional)" >> $GITHUB_STEP_SUMMARY
